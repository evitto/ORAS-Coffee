<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6F4E37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ORAS POS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>ORAS Coffee POS</title>
<style>
:root{--bg:#F8F7F4;--tx:#242321;--ac:#6F4E37;--ac2:#5a3e2b;--sec:#E9E2D8;--card:#fff;--bd:#e4ded4;--mut:#6b655d;--ok:#4f7a5a;--bad:#a8473a;--sh:0 1px 3px rgba(36,35,33,.07)}
[data-theme=dark]{--bg:#1c1b19;--tx:#f1ede6;--ac:#c49a74;--ac2:#d8b090;--sec:#2c2a27;--card:#252421;--bd:#38352f;--mut:#a39c91;--ok:#7fb48c;--bad:#e0806f;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--sec);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
html,body{overscroll-behavior:none}body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}input{-webkit-user-select:text;user-select:text}button{touch-action:manipulation}
button{cursor:pointer;border:0;background:none;min-height:44px;transition:transform .1s,background .15s,opacity .15s}
button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#app{max-width:720px;margin:0 auto;background:var(--bg);box-shadow:0 0 0 1px var(--bd);height:100%;display:flex;flex-direction:column;position:relative}
header{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.brand{display:flex;align-items:center;justify-content:flex-start;gap:10px;min-width:0}.bn{display:flex;flex-direction:column;align-items:flex-start;min-width:0}
#logo{width:38px;height:38px;border-radius:10px;object-fit:cover;flex:none}#logo[hidden]{display:none}
header h1{font-size:19px;line-height:1.2;margin:0;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ono{justify-self:end;font-weight:600;background:var(--sec);padding:6px 12px;border-radius:99px;font-size:14px}
main{flex:1;overflow-y:auto;padding:0 16px 24px;scroll-behavior:smooth}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:6px 16px 10px;scroll-padding-inline:16px;background:var(--bg);scrollbar-width:none;-ms-overflow-style:none;cursor:grab;user-select:none;-webkit-user-select:none;overscroll-behavior-x:contain}.tabs.drag{cursor:grabbing}.tab:first-child{margin-left:auto}.tab:last-child{margin-right:auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;white-space:nowrap;padding:0 16px;border-radius:99px;background:var(--sec);font-weight:500}
.tab.on{background:var(--ac);color:#fff}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr);gap:14px}}
.pc{text-align:center;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:2px;min-height:128px}
.pc .em{font-size:26px}.pc b{font-size:15px}.pc small{color:var(--mut);font-size:12.5px;flex:1}.pc .pr{font-weight:700;color:var(--ac)}
.pc.off{opacity:.45}.pc.off .pr{color:var(--bad)}
.bar{margin:0 12px 8px;display:flex;align-items:center;gap:12px;background:var(--ac);color:#fff;border-radius:16px;padding:8px 8px 8px 16px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.bar span{flex:1;font-weight:600}.bar button{background:#fff;color:var(--ac);border-radius:12px;padding:0 16px;font-weight:700}
nav{display:flex;border-top:1px solid var(--bd);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut);padding:6px 0;min-height:56px}
nav button.on{color:var(--ac);font-weight:600}nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{width:100%;min-height:52px;border-radius:14px;background:var(--ac);color:#fff;font-weight:700;font-size:17px}
.btn.sec{background:var(--sec);color:var(--tx)}.btn.bad{background:var(--bad)}.btn.sm{min-height:44px;font-size:15px;width:auto;padding:0 16px}
h2{font-size:22px;margin:8px 0 14px}h3{font-size:14px;margin:16px 0 8px;color:var(--mut);font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bd);width:100%;text-align:left}
.row .g{flex:1;min-width:0}.row small{color:var(--mut);display:block}
.lst{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:0 14px}.lst .row:last-child{border:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}.stats .card{text-align:center}.stats .card small{color:var(--mut)}.stats .card b{display:block;font-size:24px;letter-spacing:-.5px}
.big{grid-column:1/-1;background:var(--ac);color:#fff}.big small{color:#fff!important;opacity:.8}.big b{font-size:34px!important}
.empty{text-align:center;color:var(--mut);padding:48px 16px}.empty .em{font-size:40px}
#ov{position:fixed;inset:0;background:rgba(20,18,15,.45);z-index:20;display:none;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
#ov.show{display:flex}#ov.open{opacity:1}
.sh{background:var(--bg);width:100%;max-width:720px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(40px);transition:transform .22s}
#ov.open .sh{transform:none}.sh.dlg{border-radius:20px;margin:auto 16px;max-width:380px;padding-top:20px}#ov:has(.dlg){align-items:center}
.grab{width:40px;height:4px;border-radius:9px;background:var(--bd);margin:4px auto 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{padding:0 16px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card)}
.chip.on{border-color:var(--ac);background:var(--ac);color:#fff}
.qty{display:flex;align-items:center;gap:4px}.qty button{width:44px;height:44px;border-radius:12px;background:var(--sec);font-size:20px}.qty span{min-width:22px;text-align:center;font-weight:600}
.tot{display:flex;justify-content:space-between;padding:4px 0;color:var(--mut)}.tot.f{color:var(--tx);font-size:22px;font-weight:700;padding:10px 0}
.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.keys button{min-height:54px;border-radius:14px;background:var(--card);border:1px solid var(--bd);font-size:24px;font-weight:600}
.amt{font-size:34px;font-weight:700;text-align:center;padding:8px}.chg{text-align:center;font-weight:700;color:var(--ok);font-size:20px;min-height:30px}.chg.bad{color:var(--bad)}
.ok{width:68px;height:68px;border-radius:50%;background:var(--ok);color:#fff;font-size:38px;display:flex;align-items:center;justify-content:center;margin:10px auto}
#receipt{text-align:center}#receipt .l{display:flex;justify-content:space-between;text-align:left;padding:3px 0}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=number],select{width:100%;min-height:48px;border-radius:12px;border:1.5px solid var(--bd);background:var(--card);padding:0 12px}
.sw{display:flex;align-items:center;justify-content:space-between;min-height:48px;border-bottom:1px solid var(--bd)}.sw input{width:22px;height:22px;accent-color:var(--ac)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.dots{display:flex;justify-content:center;gap:14px;margin:18px 0 8px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ac)}.dots i.on{background:var(--ac)}
.sh{position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}.pd{padding:12px 0;border-bottom:1px solid var(--bd)}.pd:last-child{border:0}
.stk{position:sticky;bottom:0;z-index:3;background:var(--bg);padding:10px 0 calc(18px + env(safe-area-inset-bottom))}.sh:has(.stk){padding-bottom:0}.chips.q{flex-wrap:nowrap}.chips.q .chip{flex:1;padding:0 4px;font-size:15px;white-space:nowrap}
.cl{position:absolute;top:6px;right:10px;z-index:2}.sh h2{padding-right:44px}.dlg h2,#receipt h2{padding:0}.sh:focus{outline:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.ib{width:44px;height:44px;border-radius:12px;background:var(--sec)}
@media print{body *{visibility:hidden}#receipt,#receipt *{visibility:visible}#ov{position:absolute;background:none;display:block}.sh{position:static;transform:none;max-height:none;overflow:visible;background:#fff;color:#000;padding:0}#receipt{position:absolute;left:0;top:0;width:100%;color:#000}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><img id="logo" alt="" hidden><div class="bn"><h1 id="shopn">ORAS Coffee</h1></div></div>
    <span class="ono" id="ono"></span>
  </header>
  <main id="main"></main>
  <div id="barwrap"></div>
  <nav aria-label="Main">
    <button data-a="nav" data-v="pos"><svg viewBox="0 0 24 24"><path d="M5 8h12v6a5 5 0 0 1-5 5h-2a5 5 0 0 1-5-5zM17 10h2a2 2 0 0 1 0 4h-2M8 3v2M12 3v2"/></svg>POS</button>
    <button data-a="nav" data-v="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Orders</button>
    <button data-a="nav" data-v="dash"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Dashboard</button>
    <button data-a="nav" data-v="more"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>More</button>
  </nav>
</div>
<div id="ov" role="dialog" aria-modal="true"><div class="sh" id="sh" tabindex="-1"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ CONFIG (edit products, options, colors here) ============ */
const SEED=[['Coffee','Espresso',90,'Double shot','☕'],['Coffee','Americano',110,'Espresso + water','☕'],['Coffee','Cappuccino',140,'Foamy and rich','☕'],['Coffee','Latte',150,'Smooth, steamed milk','🥛'],['Coffee','Mocha',160,'Chocolate + espresso','🍫'],['Coffee','Spanish Latte',170,'Sweet condensed milk','🥛'],['Coffee','Cold Brew',160,'Steeped 18 hours','🧊'],
['Non-Coffee','Chocolate',140,'Rich cocoa','🍫'],['Non-Coffee','Matcha Latte',160,'Ceremonial matcha','🍵'],['Non-Coffee','Strawberry Milk',150,'Fresh berry','🍓'],
['Tea','English Breakfast',100,'Classic black','🫖'],['Tea','Green Tea',100,'Light and clean','🍃'],['Tea','Iced Tea',120,'House blend','🧊'],
['Pastries','Croissant',120,'Buttery, baked daily','🥐'],['Pastries','Chocolate Muffin',110,'Double chocolate','🧁'],['Pastries','Banana Bread',100,'Moist slice','🍞'],['Pastries','Cinnamon Roll',130,'Cream cheese glaze','🍥'],
['Add-ons','Extra Shot',40,'Espresso shot','➕'],['Add-ons','Oat Milk',40,'Dairy-free','🌾'],['Add-ons','Vanilla Syrup',30,'Sweet pump','🍯'],['Add-ons','Caramel Syrup',30,'Sweet pump','🍯']];
const OPT={size:[['Small',0],['Medium',20],['Large',40]],temp:[['Hot',0],['Iced',0]],milk:[['Regular',0],['Oat',40],['Soy',30]],extras:[['Extra Shot',40],['Vanilla',30],['Caramel',30]]};
const GRP={size:{t:'Size',m:0},temp:{t:'Temperature',m:0},milk:{t:'Milk',m:0},extras:{t:'Extras',m:1}};
const DEFCATS=[{n:'Coffee',g:['size','temp','milk','extras']},{n:'Non-Coffee',g:['size','temp','milk']},{n:'Tea',g:['size','temp']},{n:'Pastries',g:[]},{n:'Add-ons',g:[]}];
const clone=o=>JSON.parse(JSON.stringify(o));

/* ============ STORAGE ============ */
const LS={get:(k,d)=>{try{const v=localStorage.getItem('bb_'+k);return v==null?d:JSON.parse(v)}catch{return d}},set:(k,v)=>{try{localStorage.setItem('bb_'+k,JSON.stringify(v))}catch{}}};
const DEF={shop:'ORAS Coffee',logo:'',cur:'₱',rShop:true,rNo:true,rPay:true,dark:false,pin:''};

/* ============ STATE ============ */
let S={
  products:LS.get('products',null)||SEED.map((s,i)=>({id:'p'+i,cat:s[0],name:s[1],price:s[2],desc:s[3],em:s[4],on:true})),
  orders:LS.get('orders',[]),opts:LS.get('opts',null)||clone(OPT),cats:LS.get('cats',null)||clone(DEFCATS),settings:{...DEF,...LS.get('settings',{})},
  cart:LS.get('cart',{items:[],dc:null}),discounts:LS.get('discounts',null)||[{id:'d1',name:'Senior / PWD',type:'pct',v:20},{id:'d2',name:'Staff',type:'pct',v:10},{id:'d3',name:'Loyalty',type:'pct',v:5}],next:LS.get('next',1001),
  view:'pos',sub:null,cat:'Coffee',cur:null,pay:{m:'Cash',r:''}
};
const persist=k=>LS.set(k,k==='settings'?S.settings:S[k]);
LS.set('products',S.products);LS.set('cats',S.cats);LS.set('opts',S.opts);
let PF=null,PIN=null,IP=null;
const hp=c=>{let h=5381;for(const ch of 'oras'+c)h=(h*33)^ch.charCodeAt(0);return String(h>>>0)};
const CATS=()=>S.cats.map(c=>c.n);
const groupsOf=c=>(S.cats.find(x=>x.n===c)||{g:[]}).g;
const optv=(p,g)=>(p.o&&p.o[g])||S.opts[g];

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>S.settings.cur+Number(n).toLocaleString('en-PH',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
const tm=t=>new Date(t).toLocaleTimeString('en-PH',{hour:'numeric',minute:'2-digit'});
const day=t=>new Date(t).toDateString();
const today=()=>S.orders.filter(o=>day(o.t)===day(Date.now()));
const sc=d=>d.scope||'both';
const dAmt=(x,b)=>!x?0:Math.round((x.type==='pct'?Math.round(b*x.v)/100:Math.min(b,x.v))*100)/100;
const sums=c=>{
  const lines=c.items.map(i=>{const g=Math.round(i.unit*i.qty*100)/100,x=S.discounts.find(q=>q.id===i.dc),ok=x&&sc(x)!=='order';return{g,d:ok?dAmt(x,g):0,n:ok?x.name:''}});
  const sub=Math.round(lines.reduce((a,l)=>a+l.g,0)*100)/100,di=Math.round(lines.reduce((a,l)=>a+l.d,0)*100)/100;
  const xo=S.discounts.find(q=>q.id===c.dc),dor=xo&&sc(xo)!=='item'?dAmt(xo,Math.round((sub-di)*100)/100):0,d=Math.round((di+dor)*100)/100;
  return{lines,sub,di,dor,d,name:dor?xo.name:'',total:Math.round((sub-d)*100)/100}};
const count=c=>c.items.reduce((a,i)=>a+i.qty,0);

/* ============ TOAST ============ */
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1600)}

/* ============ MODALS ============ */
function sheet(html,dlg){const o=$('#ov'),s=$('#sh'),first=!o.classList.contains('show');$('#toast').classList.remove('on');s.className='sh'+(dlg?' dlg':'');s.innerHTML=(dlg?'':'<div class="grab"></div><button class="ib cl" data-a="close" aria-label="Close">✕</button>')+html;if(!o.classList.contains('show')){o.classList.add('show');requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('open')))}const f=s.querySelector('[autofocus]');if(f)f.focus();else if(first)s.focus()}
function closeSheet(){const o=$('#ov');o.classList.remove('open');setTimeout(()=>{if(!o.classList.contains('open'))o.classList.remove('show')},200);S.cur=null;PF=null;PIN=null}
function confirmDlg(msg,fn,label='Confirm',keep='Cancel'){window._cf=fn;sheet(`<h2 style="font-size:19px">${esc(msg)}</h2><div style="display:flex;gap:8px;margin-top:16px"><button class="btn sec" data-a="close">${keep}</button><button class="btn bad" data-a="cfok">${label}</button></div>`,1)}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();if(e.key==='Enter'){const i=e.target.id;if(i==='nc')A.cadd();else if(i==='cn1'&&S.pay)A.nameok();else if(['f1','f3','f4'].includes(i)&&PF)A.savep()}});

/* ============ RENDER ============ */
function render(){
  document.documentElement.dataset.theme=S.settings.dark?'dark':'light';document.querySelector('meta[name=theme-color]').content=S.settings.dark?'#1c1b19':'#6F4E37';
  $('#shopn').textContent=S.settings.shop;const lg=$('#logo');if(S.settings.logo){lg.src=S.settings.logo;lg.hidden=false}else lg.hidden=true;$('#ono').textContent='#'+S.next;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  const m=$('#main');
  m.innerHTML=({pos:vPos,orders:vOrders,dash:vDash,more:vMore})[S.view]();
  centerTab();renderBar();
}
function centerTab(){const t=$('.tabs'),a=t&&t.querySelector('.on');if(a)t.scrollLeft=a.offsetLeft-(t.clientWidth-a.offsetWidth)/2}
function renderBar(){
  const n=count(S.cart),w=$('#barwrap');
  w.innerHTML=n&&S.view==='pos'?`<div class="bar"><span>${n} item${n>1?'s':''} · ${fmt(sums(S.cart).total)}</span><button data-a="cart">View Order</button></div>`:'';
}
function vPos(){
  if(!S.cats.some(c=>c.n===S.cat))S.cat=(S.cats[0]||{}).n;
  const ps=S.products.filter(p=>p.cat===S.cat);
  return `<div class="tabs" role="tablist">${CATS().map(c=>`<button class="tab ${c===S.cat?'on':''}" role="tab" aria-selected="${c===S.cat}" data-a="cat" data-v="${esc(c)}">${esc(c)}</button>`).join('')}</div>
  ${ps.length?`<div class="grid">${ps.map(p=>`<button class="pc ${p.on?'':'off'}" data-a="prod" data-id="${p.id}" aria-label="${esc(p.name)} ${fmt(p.price)}${p.on?'':' unavailable'}"><span class="em">${p.em||'☕'}</span><b>${esc(p.name)}</b><small>${p.on?esc(p.desc):'Unavailable today'}</small><span class="pr">${fmt(p.price)}</span></button>`).join('')}</div>`:'<div class="empty"><div class="em">☕</div>No products here yet.<br>Add some under More → Products.</div>'}`;
}
const orow=o=>`<button class="row" data-a="ord" data-id="${o.no}"><b>#${o.no}</b><span class="g"><small style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${o.cust?`<b style="color:var(--tx);font-weight:600;display:inline-block;max-width:9em;overflow:hidden;text-overflow:ellipsis;vertical-align:bottom">${esc(o.cust)}</b> · `:''}${tm(o.t)} · ${o.method}${o.voided?' · <span style="color:var(--bad)">Voided</span>':o.void?' · <span style="color:var(--bad)">Cancelled</span>':''}</small></span><b style="${o.void||o.voided?'text-decoration:line-through;color:var(--mut)':''}">${fmt(o.total)}</b></button>`;
function vOrders(){const o=today().slice().reverse();return `<h2>Today's orders</h2>${o.length?`<div class="lst">${o.map(orow).join('')}</div>`:'<div class="empty"><div class="em">🧾</div>No orders yet today.<br>Completed orders will show up here.</div>'}`}
function vDash(){
  const o=today().filter(x=>!x.void&&!x.voided),tot=o.reduce((a,x)=>a+x.total,0),q={};
  o.forEach(x=>x.items.forEach(i=>q[i.name]=(q[i.name]||0)+i.qty));
  const top=Object.entries(q).sort((a,b)=>b[1]-a[1])[0];
  return `<h2>Today</h2><div class="stats"><div class="card big"><small>Today's Sales</small><b>${fmt(tot)}</b></div><div class="card"><small>Orders</small><b>${o.length}</b></div><div class="card"><small>Average Order</small><b>${fmt(o.length?Math.round(tot/o.length*100)/100:0)}</b></div><div class="card" style="grid-column:1/-1"><small>Top Seller</small><b style="font-size:20px">${top?esc(top[0]):'—'}</b></div></div>
  <h3>Recent orders</h3>${o.length?`<div class="lst">${o.slice(-5).reverse().map(orow).join('')}</div>`:'<div class="empty">No sales yet today.</div>'}`;
}
function vMore(){
  const s=S.settings;

  if(S.sub==='opts')return `<div style="display:flex;align-items:center;gap:8px"><button class="ib" data-a="sub" data-v="" aria-label="Back">←</button><h2 style="margin:0;flex:1">Option prices</h2></div><p style="color:var(--mut);margin:0 0 4px">Default choices and extra charges. Every product uses these unless you set custom prices in its product form. Use 0 for no charge.</p>${Object.keys(GRP).map(g=>optRows('d',g,S.opts[g])).join('')}`;
  if(S.sub==='products')return `<div style="display:flex;align-items:center;gap:8px"><button class="ib" data-a="sub" data-v="" aria-label="Back">←</button><h2 style="margin:0;flex:1">Products</h2><button class="btn sm" data-a="editp" data-id="">+ Add</button></div><div class="lst" style="margin-top:14px">${S.products.map(p=>`<div class="row"><button class="g" style="text-align:left" data-a="editp" data-id="${p.id}"><b>${p.em||''} ${esc(p.name)}</b><small>${esc(p.cat)} · ${fmt(p.price)}${p.on?'':' · Unavailable'}</small></button><button class="ib" data-a="tog" data-id="${p.id}" aria-label="Toggle availability">${p.on?'✅':'⛔'}</button></div>`).join('')}</div>`;

    return `<div style="display:flex;align-items:center;gap:8px"><button class="ib" data-a="sub" data-v="" aria-label="Back">←</button><h2 style="margin:0">Settings</h2></div>

/* ============ CUSTOMIZE ============ */
function openProd(id){
  const p=S.products.find(x=>x.id===id);if(!p)return;
  if(!p.on)return toast(p.name+' is unavailable');
  const g=groupsOf(p.cat).filter(k=>optv(p,k).length);
  if(!g.length)return addLine(p,[],p.price,1);
  S.cur={p,sel:{size:0,temp:0,milk:0,extras:[]}};drawCust();
}
function custPrice(){const{p,sel}=S.cur;let t=p.price;groupsOf(p.cat).forEach(g=>{const v=optv(p,g);if(GRP[g].m)sel[g].forEach(i=>t+=(v[i]||[0,0])[1]);else t+=(v[sel[g]]||[0,0])[1]});return Math.max(0,Math.round(t*100)/100)}
function drawCust(){
  const{p,sel}=S.cur;
  sheet(`<h2>${p.em||''} ${esc(p.name)}</h2>${groupsOf(p.cat).filter(g=>optv(p,g).length).map(g=>{const m=GRP[g].m;return `<h3>${GRP[g].t}</h3><div class="chips">${optv(p,g).map((x,i)=>{const on=m?sel[g].includes(i):sel[g]===i;return `<button class="chip ${on?'on':''}" data-a="grp" data-g="${g}" data-i="${i}" aria-pressed="${on}">${esc(x[0])}${x[1]?` ${x[1]>0?'+':'−'}${fmt(Math.abs(x[1]))}`:''}</button>`}).join('')}</div>`}).join('')}
  <div class="stk"><button class="btn" data-a="addc">Add to Order — ${fmt(custPrice())}</button></div>`);
}
function addCust(){
  const{p,sel}=S.cur,opts=[];
  groupsOf(p.cat).forEach(g=>{const v=optv(p,g);if(!v.length)return;if(GRP[g].m)sel[g].forEach(i=>opts.push(v[i][0]));else opts.push(v[sel[g]][0])});
  addLine(p,opts,custPrice(),1);closeSheet();
}
function addLine(p,opts,unit,qty){
  const key=p.id+'|'+opts.join(',');const l=S.cart.items.find(i=>i.key===key);
  if(l)l.qty+=qty;else S.cart.items.push({key,name:p.name,opts,unit,qty});
  persist('cart');toast('Added to order');renderBar();
}

/* ============ CART ============ */
function discOpt(d,sel){return `<option value="${d.id}" ${sel===d.id?'selected':''}>${esc(d.name)} (${d.type==='pct'?d.v+'%':fmt(d.v)})</option>`}
const discRows=t=>`<div class="tot"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>${t.di?`<div class="tot"><span>Item discounts</span><span>−${fmt(t.di)}</span></div>`:''}${t.dor?`<div class="tot"><span>Order discount${t.name?' ('+esc(t.name)+')':''}</span><span>−${fmt(t.dor)}</span></div>`:''}`;
function drawCart(){
  const c=S.cart;if(!c.items.length){sheet(`<div class="empty"><div class="em">🛒</div>Your order is empty.<br>Tap a product to start.</div><button class="btn sec" data-a="close">Back to menu</button>`);return}
  const t=sums(c),iD=S.discounts.filter(d=>sc(d)!=='order'),oD=S.discounts.filter(d=>sc(d)!=='item');
  sheet(`<h2>Order #${S.next}</h2>${c.items.map((i,x)=>{const L=t.lines[x];return `<div class="row"><div class="g"><b>${esc(i.name)}</b><small>${i.opts.length?esc(i.opts.join(' · '))+'<br>':''}${fmt(i.unit)} each · ${fmt(L.g)}${L.d?` − ${fmt(L.d)} = <b style="color:var(--ok)">${fmt(L.g-L.d)}</b>`:''}</small>${iD.length?`<select aria-label="Item discount for ${esc(i.name)}" data-a2="ldisc" data-x="${x}" style="width:100%;min-height:44px;font-size:14px;margin-top:6px"><option value="">No item discount</option>${iD.map(d=>discOpt(d,i.dc)).join('')}</select>`:''}</div><div class="qty"><button data-a="q" data-x="${x}" data-d="-1" aria-label="Decrease">−</button><span>${i.qty}</span><button data-a="q" data-x="${x}" data-d="1" aria-label="Increase">+</button></div><button class="ib" data-a="rm" data-x="${x}" aria-label="Remove ${esc(i.name)}">🗑</button></div>`}).join('')}
  <div style="margin-top:10px"><div class="tot"><span>Subtotal</span><span>${fmt(t.sub)}</span></div>${t.di?`<div class="tot"><span>Item discounts</span><span>−${fmt(t.di)}</span></div>`:''}
  ${oD.length?`<div class="tot" style="align-items:center;gap:8px"><label for="dc" style="margin:0;color:inherit;font-size:inherit">Order discount</label><select id="dc" data-a2="disc" style="width:auto;flex:1;min-width:0"><option value="">None</option>${oD.map(d=>discOpt(d,c.dc)).join('')}</select><span>−${fmt(t.dor)}</span></div>`:''}
  <div class="tot f"><span>Total</span><span>${fmt(t.total)}</span></div></div>
  <div class="stk"><button class="btn" data-a="co">Checkout</button></div>`);
}

/* ============ CHECKOUT ============ */
function drawName(){
  sheet(`<h2>Customer name</h2><p style="color:var(--mut);margin:0 0 4px">Order #${S.next} · ${fmt(sums(S.cart).total)}</p>
  <label for="cn1">Name (optional)</label><input type="text" id="cn1" maxlength="40" autocomplete="off" placeholder="e.g. Maria" value="${esc(S.pay.c||'')}" autofocus>
  <div style="display:grid;gap:8px;margin-top:18px"><button class="btn" data-a="nameok">Continue to Payment</button><button class="btn sec" data-a="nameskip">Skip</button><button class="btn sec" data-a="cart">Back to order</button></div>`);
}
function drawPay(){
  const t=sums(S.cart),p=S.pay,r=+p.r||0,ch=r-t.total,cash=p.m==='Cash';
  sheet(`<h2>Payment</h2>${p.c?`<div class="tot" style="align-items:center"><span>Customer: <b style="color:var(--tx)">${esc(p.c)}</b></span><button class="btn sec sm" style="min-height:36px;font-size:14px" data-a="cust">Edit</button></div>`:''}${discRows(t)}<div class="tot f"><span>Total</span><span>${fmt(t.total)}</span></div>
  <div class="pay">${['Cash','GCash','Card'].map(m=>`<button class="chip ${p.m===m?'on':''}" data-a="pm" data-v="${m}" aria-pressed="${p.m===m}">${m}</button>`).join('')}</div>
  ${cash?`<label>Amount Received</label><div class="amt">${fmt(r)}</div><div class="chg ${ch<0&&r?'bad':''}">${r?(ch>=0?'Change: '+fmt(ch):'Short by '+fmt(-ch)):''}</div>
  <div class="chips q">${[100,200,500,1000].map(v=>`<button class="chip" data-a="quick" data-v="${v}">${fmt(v)}</button>`).join('')}<button class="chip" data-a="quick" data-v="${t.total}">Exact</button></div>
  <div class="keys">${['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>`<button data-a="key" data-v="${k}" aria-label="${k==='⌫'?'Backspace':k}">${k}</button>`).join('')}</div>`:`<p style="text-align:center;color:var(--mut);padding:18px 0">Confirm ${p.m} payment of <b style="color:var(--tx)">${fmt(t.total)}</b> was received.</p>`}
  <div class="stk"><button class="btn" data-a="done" ${cash&&r<t.total?'disabled':''}>Complete Payment</button></div>`);
}
function complete(){
  if(!S.cart.items.length)return;
  const t=sums(S.cart),p=S.pay,cash=p.m==='Cash',r=cash?+p.r:t.total;
  const o={no:S.next,t:Date.now(),items:S.cart.items.map((i,k)=>({name:i.name,opts:i.opts,qty:i.qty,unit:i.unit,dd:t.lines[k].d,dn:t.lines[k].n})),sub:t.sub,disc:t.d,di:t.di,dor:t.dor,dname:t.name,total:t.total,method:p.m,recv:r,change:Math.max(0,r-t.total),cust:p.c||''};
  S.orders.push(o);S.cart={items:[],dc:null};S.next++;
  ['orders','cart','next'].forEach(persist);
  showReceipt(o,true);render();
}
function showReceipt(o,fresh){
  const s=S.settings;
  sheet(`<div id="receipt">${fresh?'<div class="ok">✓</div><h2>Payment Complete</h2>':'<h2>Order details</h2>'+(o.voided?'<div style="color:var(--bad);font-weight:700;margin-bottom:6px">Voided at '+tm(o.voided)+'</div>':o.void?'<div style="color:var(--bad);font-weight:700;margin-bottom:6px">Cancelled at '+tm(o.void)+'</div>':'')}
  ${s.rShop&&s.logo?`<img src="${s.logo}" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:cover;display:block;margin:0 auto 6px">`:''}${s.rShop?`<div style="font-weight:700">${esc(s.shop)}</div>`:''}<div style="color:var(--mut);margin-bottom:10px">${s.rNo?'Order #'+o.no+' · ':''}${new Date(o.t).toLocaleDateString('en-PH')} ${tm(o.t)}${o.cust?`<br><span style="color:var(--tx)">Customer: <b>${esc(o.cust)}</b></span>`:''}</div>
  <div style="border-top:1px dashed var(--bd);border-bottom:1px dashed var(--bd);padding:8px 0;margin-bottom:8px">${o.items.map(i=>`<div class="l"><span>${esc(i.name)} × ${i.qty}${i.opts.length?`<small style="display:block;color:var(--mut)">${esc(i.opts.join(', '))}</small>`:''}${i.dd?`<small style="display:block;color:var(--mut)">${esc(i.dn)} −${fmt(i.dd)}</small>`:''}</span><span>${fmt(i.unit*i.qty)}</span></div>`).join('')}</div>
  ${o.disc?`<div class="l"><span>Subtotal</span><span>${fmt(o.sub)}</span></div>`:''}${o.di?`<div class="l"><span>Item discounts</span><span>−${fmt(o.di)}</span></div>`:''}${(o.di===undefined?o.disc:o.dor)?`<div class="l"><span>${o.di===undefined?'Discount':'Order discount'}${o.dname?' ('+esc(o.dname)+')':''}</span><span>−${fmt(o.di===undefined?o.disc:o.dor)}</span></div>`:''}<div class="l" style="font-size:20px"><b>Total</b><b>${fmt(o.total)}</b></div>
  ${s.rPay?`<div class="l"><span>Payment</span><span>${o.method}</span></div>`:''}${o.method==='Cash'?`<div class="l"><span>Received</span><span>${fmt(o.recv)}</span></div><div class="l"><span>Change</span><span>${fmt(o.change)}</span></div>`:''}</div>
  <div style="display:grid;gap:8px;margin-top:16px"><button class="btn" data-a="${fresh?'newo':'close'}">${fresh?'New Order':'Close'}</button><button class="btn sec" data-a="print">Print Receipt</button>${!fresh?(o.voided?`<button class="btn sec" data-a="vrs" data-id="${o.no}">🔒 Restore voided order</button>`:o.void?`<button class="btn sec" data-a="unvoid" data-id="${o.no}">Restore order</button>`:`<button class="btn sec" style="color:var(--bad)" data-a="void" data-id="${o.no}">Cancel order</button><button class="btn sec" style="color:var(--bad)" data-a="vdo" data-id="${o.no}">🔒 Void order</button>`):''}</div>`);
}

/* ============ PRODUCTS ============ */
const swS='color:var(--tx);font-size:16px;margin:8px 0 0';
function optRows(sc,g,v){
  return `<h3>${GRP[g].t}</h3>${v.map((x,i)=>`<div style="display:flex;gap:6px;margin-bottom:6px"><input type="text" aria-label="${GRP[g].t} choice name" data-oe="${sc}|${g}|${i}|0" value="${esc(x[0])}" style="flex:1;min-width:0"><input type="number" aria-label="Price" inputmode="decimal" data-oe="${sc}|${g}|${i}|1" value="${x[1]}" style="width:90px"><button class="ib" data-a="oDel" data-sc="${sc}" data-g="${g}" data-i="${i}" aria-label="Remove choice">✕</button></div>`).join('')}<button class="btn sec sm" data-a="oAdd" data-sc="${sc}" data-g="${g}">+ Add choice</button>`;
}
function syncPF(){if(!PF||!$('#f1'))return;PF.name=$('#f1').value;PF.cat=$('#f2').value;PF.price=$('#f3').value;PF.desc=$('#f4').value;PF.on=$('#f5').checked}
function editProd(id){const p=S.products.find(x=>x.id===id);PF=p?{...clone(p),id}:{id:'',name:'',cat:S.cat,price:'',desc:'',on:true,o:null};drawPF(1)}
function drawPF(first){
  const p=PF,gs=groupsOf(p.cat);
  if(p.o)gs.forEach(g=>{if(!p.o[g])p.o[g]=clone(S.opts[g])});
  sheet(`<h2>${p.id?'Edit product':'Add product'}</h2>
  <label for="f1">Product name</label><input type="text" id="f1" value="${esc(p.name)}" ${first?'autofocus':''}>
  <label for="f2">Category</label><select id="f2">${CATS().map(c=>`<option ${c===p.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
  <label for="f3">Price</label><input type="number" id="f3" inputmode="decimal" min="0" value="${p.price}">
  <label for="f4">Description</label><input type="text" id="f4" value="${esc(p.desc)}">
  <label class="sw" style="${swS}">Available<input type="checkbox" id="f5" ${p.on?'checked':''}></label>
  ${gs.length?`<label class="sw" style="${swS}">Custom option prices for this item<input type="checkbox" id="f6" ${p.o?'checked':''}></label>${p.o?gs.map(g=>optRows('p',g,p.o[g])).join(''):'<p style="color:var(--mut);font-size:13px;margin:8px 0 0">Uses the defaults from More → Option prices.</p>'}`:''}
  <div style="display:grid;gap:8px;margin-top:18px"><button class="btn" data-a="savep">Save Product</button>${p.id?'<button class="btn sec" style="color:var(--bad)" data-a="delp" data-id="'+p.id+'">Delete product</button>':''}<button class="btn sec" data-a="close">Cancel</button></div>`);
}
function saveProd(){
  syncPF();const name=PF.name.trim(),price=parseFloat(PF.price);
  if(!name||isNaN(price)||price<0)return toast('Enter a name and valid price');
  const d={name,cat:PF.cat,price,desc:PF.desc.trim(),on:PF.on,o:PF.o};
  if(PF.id)Object.assign(S.products.find(p=>p.id===PF.id),d);else S.products.push({id:'p'+Date.now(),em:'☕',...d});
  persist('products');closeSheet();render();toast('Product saved');
}
const oArr=(sc,g)=>sc==='d'?S.opts[g]:PF.o[g];
function oDone(sc){if(sc==='d'){persist('opts');render()}else drawPF()}

/* ============ PASSCODE ============ */
function pinPad(title,sub,done){PIN={b:'',title,sub,done};drawPin()}
function drawPin(){
  sheet(`<h2 style="text-align:center;font-size:19px;margin:6px 0 2px;padding:0">${esc(PIN.title)}</h2><p style="text-align:center;color:var(--mut);margin:0">${esc(PIN.sub)}</p>
  <div class="dots" role="img" aria-label="${PIN.b.length} of 4 digits entered">${[0,1,2,3].map(i=>`<i class="${i<PIN.b.length?'on':''}"></i>`).join('')}</div>
  <div class="keys">${['1','2','3','4','5','6','7','8','9','','0','⌫'].map(k=>k?`<button data-a="pk" data-v="${k}" aria-label="${k==='⌫'?'Backspace':k}">${k}</button>`:'<span></span>').join('')}</div><button class="btn sec" data-a="close">Cancel</button>`);
}
let fails=0,lock=0;
function chk(c){if(Date.now()<lock){toast('Too many attempts. Try again in a moment');return false}if(hp(c)===S.settings.pin){fails=0;return true}if(++fails>=5){lock=Date.now()+30000;fails=0}toast('Incorrect passcode');return false}
function askPin(title,cb){
  if(!S.settings.pin){toast('Set a void passcode in More → Settings first');return}
  pinPad(title,'Enter passcode',c=>{if(!chk(c))return false;closeSheet();cb()});
}
function newPin(){
  pinPad('New passcode','Choose 4 digits',c1=>{pinPad('Confirm passcode','Enter it again',c2=>{if(c1!==c2){toast("Passcodes don't match");return false}S.settings.pin=hp(c2);persist('settings');closeSheet();render();toast('Passcode saved')})});
}
function needPin(title,cb){pinPad(title,'Enter current passcode',c=>{if(!chk(c))return false;cb()})}

/* ============ ACTIONS ============ */
const A={
  nav:d=>{S.view=d.v;S.sub=null;render()},
  sub:d=>{S.sub=d.v||null;render()},
  cat:d=>{S.cat=d.v;render()},
  prod:d=>openProd(d.id),
  grp:d=>{const{sel,p}=S.cur,g=d.g,i=+d.i;if(GRP[g].m){const k=sel[g].indexOf(i);k<0?sel[g].push(i):sel[g].splice(k,1)}else sel[g]=i;drawCust()},
  addc:addCust,cart:drawCart,close:closeSheet,
  cfok:()=>{const f=window._cf;closeSheet();f&&f()},
  q:d=>{const i=S.cart.items[d.x];i.qty+=+d.d;if(i.qty<1)S.cart.items.splice(d.x,1);persist('cart');drawCart();renderBar()},
  rm:d=>{S.cart.items.splice(d.x,1);persist('cart');drawCart();renderBar()},
  co:()=>{S.pay={m:'Cash',r:'',c:''};drawName()},
  cust:()=>drawName(),
  nameok:()=>{const i=$('#cn1');S.pay.c=i?i.value.trim().replace(/\s+/g,' '):'';drawPay()},
  nameskip:()=>{S.pay.c='';drawPay()},
  pm:d=>{S.pay.m=d.v;drawPay()},
  quick:d=>{S.pay.r=String(d.v);drawPay()},
  key:d=>{let r=S.pay.r;if(d.v==='⌫')r=r.slice(0,-1);else if(r.length<7)r=(r+d.v).replace(/^0+(?=\d)/,'');S.pay.r=r;drawPay()},
  done:complete,
  newo:()=>{closeSheet();S.view='pos';render()},
  print:()=>window.print(),
  install:()=>{if(!IP)return;const e=IP;e.prompt();e.userChoice.finally(()=>{IP=null;if(S.view==='more'&&!S.sub)render()})},
  void:d=>{const o=S.orders.find(x=>x.no==d.id);confirmDlg(`Cancel order #${o.no}? It will be removed from today's sales.`,()=>{o.void=Date.now();persist('orders');render();toast('Order cancelled')},'Cancel order','Keep order')},
  unvoid:d=>{const o=S.orders.find(x=>x.no==d.id);delete o.void;persist('orders');render();showReceipt(o);toast('Order restored')},
  pk:d=>{if(!PIN)return;if(d.v==='⌫')PIN.b=PIN.b.slice(0,-1);else if(PIN.b.length<4)PIN.b+=d.v;drawPin();
    if(PIN.b.length===4){const cur=PIN;setTimeout(()=>{if(PIN!==cur)return;if(cur.done(cur.b)===false&&PIN===cur){cur.b='';drawPin()}},120)}},
  setpin:()=>S.settings.pin?needPin('Change passcode',newPin):newPin(),
  rmpin:()=>needPin('Remove passcode',()=>{S.settings.pin='';persist('settings');closeSheet();render();toast('Passcode removed')}),
  vdo:d=>{const o=S.orders.find(x=>x.no==d.id);askPin('Void order #'+o.no,()=>{delete o.void;o.voided=Date.now();persist('orders');render();toast('Order voided')})},
  vrs:d=>{const o=S.orders.find(x=>x.no==d.id);askPin('Restore order #'+o.no,()=>{delete o.voided;persist('orders');render();toast('Order restored')})},
  ord:d=>showReceipt(S.orders.find(o=>o.no==d.id)),
  editp:d=>editProd(d.id),savep:saveProd,
  tog:d=>{const p=S.products.find(x=>x.id===d.id);p.on=!p.on;persist('products');render()},
  delp:d=>confirmDlg('Delete this product?',()=>{S.products=S.products.filter(p=>p.id!==d.id);persist('products');render();toast('Product deleted')},'Delete'),
  pickLogo:()=>$('#lg').click(),
  rmLogo:()=>{S.settings.logo='';persist('settings');render();toast('Logo removed')},
  oAdd:d=>{if(d.sc==='p')syncPF();oArr(d.sc,d.g).push(['New',0]);oDone(d.sc)},
  oDel:d=>{if(d.sc==='p')syncPF();oArr(d.sc,d.g).splice(+d.i,1);oDone(d.sc)},
  cg:d=>{const c=S.cats[d.x],k=c.g.indexOf(d.g);k<0?c.g.push(d.g):c.g.splice(k,1);persist('cats');render()},
  cmv:d=>{const x=+d.x,y=x+ +d.d;[S.cats[x],S.cats[y]]=[S.cats[y],S.cats[x]];persist('cats');render()},
  cdel:d=>{const c=S.cats[d.x],n=S.products.filter(p=>p.cat===c.n).length;confirmDlg(`Delete "${c.n}"${n?' and its '+n+' product'+(n>1?'s':''):''}?`,()=>{S.products=S.products.filter(p=>p.cat!==c.n);S.cats.splice(d.x,1);persist('products');persist('cats');render();toast('Category deleted')},'Delete')},
  cadd:()=>{const i=$('#nc'),v=i.value.trim();if(!v)return toast('Enter a category name');if(CATS().some(c=>c.toLowerCase()===v.toLowerCase()))return toast('That category already exists');S.cats.push({n:v,g:[]});persist('cats');render();toast('Category added')},
  dadd:()=>{S.discounts.push({id:'d'+Date.now(),name:'New discount',type:'pct',v:10,scope:'both'});persist('discounts');render()},
  ddel:d=>{const x=S.discounts[d.x];confirmDlg(`Delete "${x.name}"?`,()=>{S.discounts.splice(d.x,1);persist('discounts');render()},'Delete')},
  export:()=>{const b=new Blob([JSON.stringify({products:S.products,categories:S.cats,optionPrices:S.opts,discounts:S.discounts,orders:S.orders,settings:{...S.settings,pin:undefined}},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='oras-coffee-'+new Date().toISOString().slice(0,10)+'.json';a.click();toast('Data exported')},
  clr:()=>confirmDlg('Clear all orders? This cannot be undone.',()=>{S.orders=[];persist('orders');render();toast('Orders cleared')},'Clear'),
  reset:()=>confirmDlg('Reset the POS? Products, orders and settings will be erased.',()=>{Object.keys(localStorage).filter(k=>k.startsWith('bb_')).forEach(k=>localStorage.removeItem(k));location.reload()},'Reset')
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset)});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.oe){const[sc,g,i,k]=t.dataset.oe.split('|'),row=oArr(sc,g)[+i];if(k==='0')row[0]=t.value.trim()||row[0];else row[1]=parseFloat(t.value)||0;if(sc==='d')persist('opts')}
  if(t.dataset.de){const[i,f]=t.dataset.de.split('|'),d=S.discounts[+i];if(f==='name')d.name=t.value.trim()||d.name;else if(f==='type')d.type=t.value;else if(f==='scope')d.scope=t.value;else d.v=Math.max(0,parseFloat(t.value)||0);if(d.type==='pct')d.v=Math.min(100,d.v);persist('discounts');if(f!=='name')render()}
  if(t.dataset.cn!=null){const c=S.cats[+t.dataset.cn],v=t.value.trim();if(!v||S.cats.some(x=>x!==c&&x.n.toLowerCase()===v.toLowerCase())){toast('Name is empty or already used');render();return}S.products.forEach(q=>{if(q.cat===c.n)q.cat=v});if(S.cat===c.n)S.cat=v;c.n=v;persist('cats');persist('products')}
  if(t.id==='f2'&&PF){syncPF();drawPF()}
  if(t.id==='f6'&&PF){syncPF();PF.o=t.checked?{}:null;drawPF()}
  if(t.dataset.a2==='logo')setLogo(t.files[0]);
  if(t.dataset.a2==='ldisc'){S.cart.items[+t.dataset.x].dc=t.value||null;persist('cart');drawCart();renderBar()}
  if(t.dataset.a2==='disc'){S.cart.dc=t.value||null;persist('cart');drawCart();renderBar()}
  if(t.dataset.s){const k=t.dataset.s;S.settings[k]=t.type==='checkbox'?t.checked:(t.value.trim()||DEF[k]);persist('settings');render()}
});
/* Category tabs: drag with mouse, wheel scrolls sideways (touch scrolls natively) */
(()=>{let t=null,x0=0,l0=0,moved=0;
  document.addEventListener('mousedown',e=>{const el=e.target.closest('.tabs');if(!el||e.button)return;t=el;x0=e.pageX;l0=el.scrollLeft;moved=0});
  document.addEventListener('mousemove',e=>{if(!t)return;const dx=e.pageX-x0;if(Math.abs(dx)>4){moved=1;t.classList.add('drag')}if(moved)t.scrollLeft=l0-dx});
  document.addEventListener('mouseup',()=>{if(t)t.classList.remove('drag');t=null});
  document.addEventListener('click',e=>{if(moved&&e.target.closest('.tabs')){e.stopPropagation();e.preventDefault()}moved=0},true);
  document.addEventListener('wheel',e=>{const el=e.target.closest('.tabs');if(el&&el.scrollWidth>el.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){el.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
})();
function setLogo(f){
  if(!f)return;const rd=new FileReader();
  rd.onload=()=>{const im=new Image();
    im.onload=()=>{const n=256,c=document.createElement('canvas');c.width=c.height=n;const m=Math.min(im.width,im.height);
      c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,n,n);
      S.settings.logo=c.toDataURL('image/png');persist('settings');render();toast('Logo updated')};
    im.onerror=()=>toast('Could not read that image');im.src=rd.result};
  rd.readAsDataURL(f);
}
/* ============ PWA ============ */
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();IP=e;if(S.view==='more'&&!S.sub)render()});
window.addEventListener('appinstalled',()=>{IP=null;toast('App installed');if(S.view==='more'&&!S.sub)render()});
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script>
